name: CI Test
on:
  workflow_call:
    inputs:
      appType:
        required: true
        type: string
jobs:
  NodeJSTest:
    if: inputs.appType == 'nodejs'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install
          npm test
  MavenTest:
    if: inputs.appType == 'maven'
    runs-on: self-hosted
    steps:
      - run: |
          mvn package
          mvn test