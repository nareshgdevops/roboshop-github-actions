name: CI Test
on:
  workflow_call:
    inputs:
      appType:
        required: true
        type: string
jobs:
  NodeJSTest:
    if: inputs.appType == 'nodejs'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install
          echo npm test
  MavenTest:
    if: inputs.appType == 'maven'
    runs-on: self-hosted
    steps:
      - run: |
          mvn package
          echo mvn test
  PythonTest:
    if: inputs.appType == 'python'
    runs-on: self-hosted
    steps:
      - run: |
          echo python test
  GoTest:
    if: inputs.appType == 'golang'
    runs-on: self-hosted
    steps:
      - run: |
          echo go test
  AngularTest:
    if: inputs.appType == 'angular'
    runs-on: self-hosted
    steps:
      - run: |
          echo angular test