name: CI Build
on:
  workflow_call:
    inputs:
      appType:
        required: true
        type: string
      docker_build:
        required: true
        type: string
jobs:
  NodeJSBuild:
    if: inputs.appType == 'nodejs'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - name: Docker Build
        if: inputs.docker_build == 'true'
        run: docker build .
  MavenBuild:
    if: inputs.appType == 'maven'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: mvn package
  GoBuild:
    if: inputs.appType == 'golang'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: echo go build
  AngularBuild:
    if: inputs.appType == 'angular'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: echo angular build
