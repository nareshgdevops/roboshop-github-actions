name: Dev Deploy
on:
  workflow_call:
    inputs:
      appName:
        required: true
        type: string
      appEnv:
        required: true
        type: string
      resourceGroup:
        required: true
        type: string
    secrets:
      VAULT_TOKEN:
        required: true
jobs:
  DevDeploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          repository: nareshgdevops/roboshop-helm
          path: helm
      - name: Import Vault Secrets
        id: import-secrets
        uses: hashicorp/vault-action@v2
        with:
          url: http://vault.nareshdevops1218.online:8200/
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            roboshop-infra/data/azure-service-priniciple AZURE_SUBSCRIPTION_ID | AZURE_SUBSCRIPTION_ID ;
            roboshop-infra/data/azure-service-priniciple AZURE_CLIENT_ID | AZURE_CLIENT_ID ;
            roboshop-infra/data/azure-service-priniciple AZURE_SECRET | AZURE_SECRET ;
            roboshop-infra/data/azure-service-priniciple AZURE_TENANT | AZURE_TENANT ;

      - name: Deploy
        run: |
          cd helm
          az login --service-principal --username $AZURE_CLIENT_ID --password $AZURE_SECRET --tenant $AZURE_TENANT
          az acr login --name nareshgdevops
          az aks get-credentials --name aks-main-${{ inputs.appEnv }} --resource-group ${{ inputs.resourceGroup }} --overwrite-existing
          argocd login $(kubectl get svc argo-cd-argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].ip}') --username admin --password $(kubectl get secrets argocd-initial-admin-secret -n argocd -o jsonpath='{.data.password}'| base64 --decode) --insecure
          argocd app delete ${{ inputs.appName }} -y